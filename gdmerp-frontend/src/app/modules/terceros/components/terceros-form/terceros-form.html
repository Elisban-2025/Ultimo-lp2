<div class="page-header">
  <h2>Nuevo Tercero (CRM)</h2>
</div>

<div class="card p-4">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-row">
      <div class="form-group col-md-4">
        <label>Tipo Documento</label>
        <select formControlName="tipoDocumento" class="form-control">
          <option value="RUC">RUC</option>
          <option value="DNI">DNI</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label>N° Documento</label>
        <input type="text" formControlName="numeroDocumento" class="form-control" placeholder="Ej: 20123456789">
      </div>
      <div class="form-group col-md-4">
        <label>Tipo Comercial</label>
        <select formControlName="tipoTercero" class="form-control">
          <option value="PROVEEDOR">Proveedor</option>
          <option value="CLIENTE">Cliente</option>
          <option value="AMBOS">Ambos</option>
        </select>
      </div>
    </div>

    <div class="form-group mt-3">
      <label>Razón Social / Nombres</label>
      <input type="text" formControlName="razonSocial" class="form-control">
    </div>

    <div class="form-row mt-3">
      <div class="form-group col-md-6">
        <label>Teléfono</label>
        <input type="text" formControlName="telefono" class="form-control">
      </div>
      <div class="form-group col-md-6">
        <label>Correo Electrónico</label>
        <input type="email" formControlName="correo" class="form-control">
      </div>
    </div>

    <div class="form-group mt-3">
      <label>Dirección</label>
      <input type="text" formControlName="direccion" class="form-control">
    </div>

    <div *ngIf="error()" class="alert alert-danger mt-3">{{ error() }}</div>

    <div class="mt-4">
      <button type="button" class="btn btn-outline mr-2" routerLink="/terceros/lista">Cancelar</button>
      <!-- El botón se activará solo cuando llenes los campos obligatorios -->
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Guardando...' : 'Guardar Tercero' }}
      </button>
    </div>
  </form>
</div>
