<div class="page-header">
  <h2>Registrar Nueva Compra</h2>
</div>

<div class="card p-4">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label>Proveedor</label>
        <select formControlName="idProveedor" class="form-control">
          <option value="0" disabled>Seleccione un proveedor...</option>
          <option *ngFor="let p of proveedores()" [value]="p.id">{{ p.razonSocial }} - {{ p.ruc }}</option>
        </select>
      </div>
      <div class="form-group col-md-6">
        <label>N° Comprobante</label>
        <input type="text" formControlName="numeroComprobante" class="form-control">
      </div>
    </div>

    <div class="form-row mt-3">
      <div class="form-group col-md-4">
        <label>Fecha de Emisión</label>
        <input type="date" formControlName="fechaEmision" class="form-control">
      </div>
      <div class="form-group col-md-4">
        <label>Condición de Pago</label>
        <select formControlName="condicionPago" class="form-control">
          <option value="CONTADO">Contado</option>
          <option value="CREDITO">Crédito</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label>Costo de Flete (S/)</label>
        <input type="number" formControlName="costoFlete" class="form-control">
      </div>
    </div>

    <div *ngIf="error()" class="alert alert-danger mt-3">{{ error() }}</div>

    <div class="mt-4">
      <button type="button" class="btn btn-outline mr-2" routerLink="/compras/lista">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Procesando...' : 'Registrar Compra' }}
      </button>
    </div>
  </form>
</div>
