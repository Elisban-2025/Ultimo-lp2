<div class="page-header">
  <h2>Listado de Proveedores</h2>
  <a routerLink="/compras/proveedores/nuevo" class="btn btn-primary">Nuevo Proveedor</a>
</div>

<div class="card">
  <table class="data-table">
    <thead>
      <tr>
        <th>RUC</th>
        <th>Razón Social</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Iteramos sobre los proveedores (asumiendo que en tu .ts la variable se llama proveedores) -->
      <tr *ngFor="let p of proveedores">
        <td>{{ p.ruc }}</td>
        <td>{{ p.razonSocial }}</td>
        <td>{{ p.email || '-' }}</td>
        <td>{{ p.telefono || '-' }}</td>
        <td>
          <button class="btn btn-sm btn-outline">Editar</button>
        </td>
      </tr>
      <tr *ngIf="proveedores.length === 0">
        <td colspan="5" class="text-center">No hay proveedores registrados.</td>
      </tr>
    </tbody>
  </table>
</div>
